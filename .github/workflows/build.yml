name: Build Wine for Winlator

on:
  push:
    branches: [ main, custom-wine-9.16 ]
  pull_request:
    branches: [ main, custom-wine-9.16 ]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build ARM64 Wine for Winlator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gcc-mingw-w64 \
            libx11-dev libfreetype6-dev libfreetype6-dev:amd64
      
      - name: Build native Wine tools
        run: |
          # First build the native tools
          mkdir -p wine-tools
          cd wine-tools
          ../configure --enable-win64
          make -j$(nproc) tools
          cd ..
      
      - name: Configure and build for ARM64
        run: |
          mkdir -p build-arm64
          cd build-arm64
          ../configure --host=aarch64-w64-mingw32 --with-wine-tools=$PWD/../wine-tools --enable-win64 --without-oss --disable-winemenubuilder --disable-tests
          make -j$(nproc)
      
      - name: Create artifact
        run: |
          cd build-arm64
          tar -czf ../wine-arm64.tar.gz .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64
          path: wine-arm64.tar.gz
  
  build-x86_64:
    name: Build x86_64 Wine for Winlator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gcc-mingw-w64 \
            libx11-dev libfreetype6-dev libfreetype6-dev:amd64
      
      - name: Build native Wine tools
        run: |
          # First build the native tools
          mkdir -p wine-tools
          cd wine-tools
          ../configure --enable-win64
          make -j$(nproc) tools
          cd ..
      
      - name: Configure and build for x86_64
        run: |
          mkdir -p build-x86_64
          cd build-x86_64
          ../configure --host=x86_64-w64-mingw32 --with-wine-tools=$PWD/../wine-tools --enable-win64 --without-oss --disable-winemenubuilder --disable-tests
          make -j$(nproc)
      
      - name: Create artifact
        run: |
          cd build-x86_64
          tar -czf ../wine-x86_64.tar.gz .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: wine-x86_64.tar.gz 