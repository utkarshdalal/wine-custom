name: Build Wine for Winlator

on:
  push:
    branches: [ main, custom-wine-9.16 ]
  pull_request:
    branches: [ main, custom-wine-9.16 ]
  workflow_dispatch:

jobs:
  build:
    env:
      PREFIX: /mnt/arch/prefix
    runs-on: ubuntu-latest
    steps:
      - name: "Install ArchLinux"
        run: |
          sudo apt update
          sudo apt install -y arch-install-scripts wget
          sudo mkdir -p /mnt/

          wget https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst

          sudo tar -xf archlinux-bootstrap-x86_64.tar.zst
          sudo rm -f archlinux-bootstrap-x86_64.tar.zst
          sudo mv root.x86_64 /mnt/arch

          sudo arch-chroot /mnt/arch bash -c "pacman-key --init && pacman-key --populate && sed -i 's/#Server/Server/g' /etc/pacman.d/mirrorlist && sed -i 's/CheckSpace/#CheckSpace/g' /etc/pacman.conf && pacman -Syu --noconfirm base base-devel git cmake meson ninja bison flex python-pip wget python-mako python-pyyaml unzip p7zip glslang python-docutils xmlto fop libxslt libx11 libxi libxext libxinerama libxrandr libxrender libxfixes libxcursor xorgproto"

      - name: "Setup Basic Android Runtime Environment"
        run: |
          git clone https://github.com/termux/termux-docker.git
          sudo cp -rf termux-docker/system/x86 /mnt/arch/system
          sudo chown -R $(whoami):$(whoami) /mnt/arch/system
          sudo chmod 755 -R /mnt/arch/system

      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup NDK for Cross-Compilation"
        run: |
          # Download NDK and extract it properly
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          sudo mkdir -p /mnt/arch/cache
          
          # Use unzip with -K flag to properly handle symbolic links
          sudo unzip -q -K android-ndk-r26b-linux.zip -d /mnt/arch/cache/
          sudo mv /mnt/arch/cache/android-ndk-r26b /mnt/arch/cache/android-ndk
          
          # Download and extract MinGW
          wget -q http://techer.pascal.free.fr/Red-Rose_MinGW-w64-Toolchain/Red-Rose-MinGW-w64-Posix-Urct-v12.0.0.r458.g03d8a40f5-Gcc-11.5.0.tar.xz
          sudo mkdir -p /mnt/arch/cache/mingw-temp
          sudo mkdir -p /mnt/arch/cache/mingw
          sudo tar -xf Red-Rose-MinGW-w64-Posix-Urct-v12.0.0.r458.g03d8a40f5-Gcc-11.5.0.tar.xz -C /mnt/arch/cache/mingw-temp
          sudo mv /mnt/arch/cache/mingw-temp /mnt/arch/cache/mingw
          
          # Setup permissions
          sudo chown -R $(whoami):$(whoami) /mnt/arch/cache
          sudo chmod -R 755 /mnt/arch/cache
          
          # Verify NDK installation
          ls -la /mnt/arch/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ || echo "NDK bins not found!"

          # Setup working directory
          sudo mkdir -p /mnt/arch/wine-build
          sudo cp -rf ./* /mnt/arch/wine-build/
          sudo mkdir -p /mnt/arch/wine-build/wine-tools
          sudo mkdir -p /mnt/arch/wine-build/build-arm64
          sudo mkdir -p /mnt/arch/wine-build/build-x86_64
          
          # Create prefix directory
          sudo mkdir -p $PREFIX/lib
          sudo mkdir -p $PREFIX/include
          
          # Make sure we have correct permissions
          sudo chown -R $(whoami):$(whoami) /mnt/arch/wine-build
          sudo chmod -R 755 /mnt/arch/wine-build
          sudo chown -R $(whoami):$(whoami) $PREFIX
          sudo chmod -R 755 $PREFIX

      - name: "Build X11 Dependencies for ARM64"
        run: |
            sudo arch-chroot /mnt/arch bash << 'EOF'
                #!/bin/bash
                set -e  # Exit on any error
                set -x  # Print commands as they're executed
                # Setup build environment for X11 dependencies
                export PREFIX=/prefix
                export PATH=/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:/cache/mingw/bin:$PATH
                export ANDROID_SDK=29
                export ARCH=aarch64
                export CC=$ARCH-linux-android$ANDROID_SDK-clang
                export CXX=$ARCH-linux-android$ANDROID_SDK-clang++
                export TOOLCHAIN_VERSION="$ARCH-linux-android-4.9"
                export TOOLCHAIN_TRIPLE="$ARCH-linux-android"
                
                # Set prefix and prepare pkg-config directories
                mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/share/pkgconfig"
                export PKG_CONFIG_PATH="$PREFIX/share/pkgconfig:$PREFIX/lib/pkgconfig"
                export PKG_CONFIG_LIBDIR="$PREFIX/share/pkgconfig:$PREFIX/lib/pkgconfig"
                export PKG_CONFIG="/usr/bin/pkg-config"

                # Check compiler and linker details
                echo "Compiler details:"
                $CC --version
                
                # Find out what linker is being used
                $CC -Wl,--version

                # Verify compiler works
                echo "Testing compiler..."
                echo "int main() { return 0; }" > test.c
                $CC -o test test.c || { echo "Compiler test failed"; exit 1; }
                ./test && echo "Compiler test successful"
                
                # Create a temporary build directory
                mkdir -p /x11-build
                cd /x11-build

                # Build xcb-proto
                echo 'Building xcb-proto...'
                PKG_VER=1.17.0
                SRC_URL=https://xorg.freedesktop.org/archive/individual/proto/xcb-proto-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf xcb-proto-$PKG_VER.tar.xz
                cd xcb-proto-$PKG_VER
                ./configure --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build util-macros for X11 dependencies
                echo 'Building util-macros...'
                PKG_VER=1.20.1
                SRC_URL=https://xorg.freedesktop.org/releases/individual/util/util-macros-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf util-macros-$PKG_VER.tar.xz
                cd util-macros-$PKG_VER
                ./configure --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build xorgproto (headers only)
                echo 'Building xorgproto...'
                PKG_VER=2024.1
                SRC_URL=https://xorg.freedesktop.org/archive/individual/proto/xorgproto-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf xorgproto-$PKG_VER.tar.xz
                cd xorgproto-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..

                # Build xtrans
                echo 'Building xtrans...'
                PKG_VER=1.5.0
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/xtrans-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf xtrans-$PKG_VER.tar.xz
                cd xtrans-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build libXau
                echo 'Building libXau...'
                PKG_VER=1.0.11
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXau-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXau-$PKG_VER.tar.xz
                cd libXau-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build libXdmcp
                echo 'Building libXdmcp...'
                PKG_VER=1.1.5
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXdmcp-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXdmcp-$PKG_VER.tar.xz
                cd libXdmcp-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build libxcb
                echo 'Building libxcb...'
                PKG_VER=1.17.0
                SRC_URL=https://xorg.freedesktop.org/archive/individual/lib/libxcb-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libxcb-$PKG_VER.tar.xz
                cd libxcb-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build libX11
                echo 'Building libX11...'
                PKG_VER=1.8.9
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libX11-$PKG_VER.tar.xz 
                wget -q $SRC_URL
                tar -xf libX11-$PKG_VER.tar.xz
                cd libX11-$PKG_VER

                # Apply the pthread fix patch
                echo '--- 13-libX11/configure	2024-03-02 19:00:43.598785000 -0300' > fix-pthread.patch
                echo '+++ 13-libX11.mod/configure	2024-03-02 19:01:08.520521000 -0300' >> fix-pthread.patch
                echo '@@ -22175,7 +22175,7 @@' >> fix-pthread.patch
                echo ' if test x$xthreads = xyes ; then' >> fix-pthread.patch
                echo '     case $host_os in' >> fix-pthread.patch
                echo '     linux*|gnu*|k*bsd*-gnu)' >> fix-pthread.patch
                echo '-        XTHREADLIB=-lpthread ;;' >> fix-pthread.patch
                echo '+        XTHREADLIB=-pthread ;;' >> fix-pthread.patch
                echo '     netbsd*)' >> fix-pthread.patch
                echo ' 	XTHREAD_CFLAGS="-D_POSIX_THREAD_SAFE_FUNCTIONS"' >> fix-pthread.patch
                echo ' 	XTHREADLIB="-lpthread" ;;' >> fix-pthread.patch

                patch -p1 < fix-pthread.patch

                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXfixes
                echo 'Building libXfixes...'
                PKG_VER=6.0.1
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXfixes-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXfixes-$PKG_VER.tar.xz
                cd libXfixes-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..

                # Build libXcomposite
                echo 'Building libXcomposite...'
                PKG_VER=0.4.6
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXcomposite-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXcomposite-$PKG_VER.tar.xz
                cd libXcomposite-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Build libXext
                echo 'Building libXext...'
                PKG_VER=1.3.6
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXext-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXext-$PKG_VER.tar.xz
                cd libXext-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXrender
                echo 'Building libXrender...'
                PKG_VER=0.9.11
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXrender-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXrender-$PKG_VER.tar.xz
                cd libXrender-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXcursor
                echo 'Building libXcursor...'
                PKG_VER=1.2.2
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXcursor-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXcursor-$PKG_VER.tar.xz
                cd libXcursor-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..
                
                # Build libXi
                echo 'Building libXi...'
                PKG_VER=1.8.1
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXi-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXi-$PKG_VER.tar.xz
                cd libXi-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXinerama
                echo 'Building libXinerama...'
                PKG_VER=1.1.5
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXinerama-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXinerama-$PKG_VER.tar.xz
                cd libXinerama-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXrandr
                echo 'Building libXrandr...'
                PKG_VER=1.5.4
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXrandr-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXrandr-$PKG_VER.tar.xz
                cd libXrandr-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libXxf86vm
                echo 'Building libXxf86vm...'
                PKG_VER=1.1.5
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libXxf86vm-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libXxf86vm-$PKG_VER.tar.xz
                cd libXxf86vm-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --enable-malloc0returnsnull
                make -j$(nproc)
                make install
                cd ..

                # Build libxshmfence
                echo 'Building libxshmfence...'
                PKG_VER=1.3.2
                SRC_URL=https://xorg.freedesktop.org/releases/individual/lib/libxshmfence-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf libxshmfence-$PKG_VER.tar.xz
                cd libxshmfence-$PKG_VER
                ./configure --host=$TOOLCHAIN_TRIPLE host_alias=$TOOLCHAIN_TRIPLE --prefix=$PREFIX --disable-futex
                make -j$(nproc)
                make install
                cd ..

                # Build xkeyboard-config
                echo 'Building xkeyboard-config...'
                PKG_VER=2.41
                SRC_URL=https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/xkeyboard-config-$PKG_VER.tar.xz
                wget -q $SRC_URL
                tar -xf xkeyboard-config-$PKG_VER.tar.xz
                cd xkeyboard-config-$PKG_VER
                ./configure -Dxkb-base=$PREFIX/share/X11/xkb -Dcompat-rules=true -Dxorg-rules-symlinks=false --prefix=$PREFIX
                make -j$(nproc)
                make install
                cd ..
                
                # Verify X11 libraries were properly built and installed
                echo 'Checking installed X11 libraries...'
                find $PREFIX/lib -name 'libX*.so' | sort
                find $PREFIX/include/X11 -type f | head -n 5
                find $PREFIX/lib/pkgconfig -name 'x*.pc' | sort
            EOF

      - name: "Build Wine for ARM64"
        run: |
            sudo arch-chroot /mnt/arch bash << 'EOF'
                # Setup environment
                export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:\$PKG_CONFIG_PATH
                export CPPFLAGS=\"-I$PREFIX/include\"
                export LDFLAGS=\"-L$PREFIX/lib\"
                
                cd /wine-build
                
                # First build wine-tools properly - important to unset compiler vars
                mkdir -p wine-tools
                cd wine-tools
                echo 'Configuring wine-tools...'
                # Need to unset cross-compile vars for native build
                unset CC CXX ARCH TOOLCHAIN_VERSION TOOLCHAIN_TRIPLE
                ../configure --enable-win64 --without-x
                echo 'Building wine-tools...'
                make -j$(nproc) __tooldeps__ nls/all
                cd ..
        
                # Reset environment for cross-compilation
                export PATH=/mnt/arch/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:/mnt/arch/cache/mingw/bin:$PATH
                export ANDROID_SDK=29
                export ARCH=aarch64
                export CC=$ARCH-linux-android$ANDROID_SDK-clang
                export CXX=$CC++
                export TOOLCHAIN_VERSION="$ARCH-linux-android-4.9"
                export TOOLCHAIN_TRIPLE="$ARCH-linux-android"
                
                # Build wine for ARM64
                mkdir -p build-arm64
                cd build-arm64
                echo 'Configuring ARM64 build...'
                ../configure --enable-archs=i386,x86_64 \
                --host=$TOOLCHAIN_TRIPLE \
                --with-wine-tools=/wine-build/wine-tools \
                --prefix=$PREFIX \
                --without-oss \
                --disable-winemenubuilder \
                --disable-win16 \
                --disable-tests \
                --with-x \
                --x-libraries=$PREFIX/lib \
                --x-includes=$PREFIX/include \
                --with-pulse \
                --with-gstreamer \
                --with-opengl \
                --with-gnutls \
                --with-mingw=gcc \
                --with-xinput \
                --with-xinput2 \
                --enable-nls \
                --without-xshm \
                --without-xxf86vm \
                --without-osmesa \
                --without-usb \
                --without-sdl \
                --without-cups \
                --without-netapi \
                --without-pcap \
                --without-gphoto \
                --without-v4l2 \
                --without-pcsclite \
                --without-wayland \
                --without-opencl \
                --without-dbus \
                --without-sane \
                --without-udev \
                --without-capi

                echo 'Building wine...'
                make -j$(nproc)

                echo 'Installing wine...'
                make install

                # Package the build
                cd $PREFIX
                tar -czf /wine-arm64.tar.gz .
            
                # Copy output to workspace
            EOF
            sudo cp /mnt/arch/wine-arm64.tar.gz ./

