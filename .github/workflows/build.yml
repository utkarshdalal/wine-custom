            make -j \$(nproc)
            make install
            cd ..
            
            # Build libXext
            echo 'Building libXext...'
            wget -q https://www.x.org/releases/individual/lib/libXext-1.3.5.tar.xz
            tar -xf libXext-1.3.5.tar.xz
            cd libXext-1.3.5
            ./configure --host=\$TOOLCHAIN_TRIPLE --prefix=\$PREFIX --enable-malloc0returnsnull
