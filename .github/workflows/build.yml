            tar -xf libXrender-0.9.11.tar.xz
            cd libXrender-0.9.11
            ./configure --host=\$TOOLCHAIN_TRIPLE --prefix=\$PREFIX
            make -j \$(nproc)
            make install
            cd ..
            
            # Build libXrandr
            echo 'Building libXrandr...'
            wget -q https://www.x.org/releases/individual/lib/libXrandr-1.5.3.tar.xz
            tar -xf libXrandr-1.5.3.tar.xz
            cd libXrandr-1.5.3
            ./configure --host=\$TOOLCHAIN_TRIPLE --prefix=\$PREFIX
            make -j \$(nproc)
            make install
            cd ..
            
            # Build libXinerama
            echo 'Building libXinerama...'
            wget -q https://www.x.org/releases/individual/lib/libXinerama-1.1.5.tar.xz
            tar -xf libXinerama-1.1.5.tar.xz
            cd libXinerama-1.1.5
            ./configure --host=\$TOOLCHAIN_TRIPLE --prefix=\$PREFIX
