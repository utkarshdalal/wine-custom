name: Build Wine for Winlator

on:
  push:
    branches: [ main, custom-wine-9.16 ]
  pull_request:
    branches: [ main, custom-wine-9.16 ]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build ARM64 Wine for Winlator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          # Ensure multiarch is properly set up
          sudo dpkg --add-architecture amd64
          sudo apt-get update
          
          # Install basic build dependencies
          sudo apt-get install -y build-essential flex bison gcc-mingw-w64 libx11-dev
          sudo apt-get install -y wget automake libtool pkg-config
          
          # Install FreeType dependencies for native build
          sudo apt-get install -y libfreetype6 libfreetype6:amd64 libfreetype6-dev

      - name: Cross-compile FreeType for ARM64
        run: |
          # Download and extract FreeType source
          wget https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar -xzf freetype-2.13.2.tar.gz
          cd freetype-2.13.2
          
          # Configure and build FreeType for ARM64 Windows
          ./configure --host=aarch64-w64-mingw32 --prefix=$PWD/../freetype-arm64
          make -j$(nproc)
          make install
          cd ..
          
          # Show the compiled files
          echo "FreeType ARM64 files:"
          find freetype-arm64 -type f | grep -E '\.(a|dll|lib)$'
      
      - name: Build native Wine tools
        run: |
          # First build the native tools
          mkdir -p wine-tools
          cd wine-tools
          PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig" ../configure --enable-win64
          make -j$(nproc) tools
          cd ..
      
      - name: Configure and build for ARM64
        run: |
          mkdir -p build-arm64
          cd build-arm64
          # Use the cross-compiled FreeType
          export FREETYPE_CFLAGS="-I$PWD/../freetype-arm64/include/freetype2"
          export FREETYPE_LIBS="-L$PWD/../freetype-arm64/lib -lfreetype"
          ../configure --host=aarch64-w64-mingw32 --with-wine-tools=$PWD/../wine-tools \
            --enable-win64 --without-oss --disable-winemenubuilder --disable-tests \
            --with-freetype
          make -j$(nproc)
      
      - name: Create artifact
        run: |
          cd build-arm64
          tar -czf ../wine-arm64.tar.gz .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64
          path: wine-arm64.tar.gz
  
  build-x86_64:
    name: Build x86_64 Wine for Winlator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          # Ensure multiarch is properly set up
          sudo dpkg --add-architecture amd64
          sudo apt-get update
          
          # Install basic build dependencies
          sudo apt-get install -y build-essential flex bison gcc-mingw-w64 libx11-dev
          sudo apt-get install -y wget automake libtool pkg-config
          
          # Install FreeType dependencies for native build
          sudo apt-get install -y libfreetype6 libfreetype6:amd64 libfreetype6-dev

      - name: Cross-compile FreeType for x86_64
        run: |
          # Download and extract FreeType source
          wget https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar -xzf freetype-2.13.2.tar.gz
          cd freetype-2.13.2
          
          # Configure and build FreeType for x86_64 Windows
          ./configure --host=x86_64-w64-mingw32 --prefix=$PWD/../freetype-x86_64
          make -j$(nproc)
          make install
          cd ..
          
          # Show the compiled files
          echo "FreeType x86_64 files:"
          find freetype-x86_64 -type f | grep -E '\.(a|dll|lib)$'
      
      - name: Build native Wine tools
        run: |
          # First build the native tools
          mkdir -p wine-tools
          cd wine-tools
          PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig" ../configure --enable-win64
          make -j$(nproc) tools
          cd ..
      
      - name: Configure and build for x86_64
        run: |
          mkdir -p build-x86_64
          cd build-x86_64
          # Use the cross-compiled FreeType
          export FREETYPE_CFLAGS="-I$PWD/../freetype-x86_64/include/freetype2"
          export FREETYPE_LIBS="-L$PWD/../freetype-x86_64/lib -lfreetype"
          ../configure --host=x86_64-w64-mingw32 --with-wine-tools=$PWD/../wine-tools \
            --enable-win64 --without-oss --disable-winemenubuilder --disable-tests \
            --with-freetype
          make -j$(nproc)
      
      - name: Create artifact
        run: |
          cd build-x86_64
          tar -czf ../wine-x86_64.tar.gz .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: wine-x86_64.tar.gz 