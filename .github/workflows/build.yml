            make -j \$(nproc)
            make install
            cd ..
            
            # Verify X11 libraries were properly built and installed
            echo 'Checking installed X11 libraries...'
            find \$PREFIX/lib -name 'libX*.so' | sort
            find \$PREFIX/include/X11 -type f | head -n 5
            find \$PREFIX/lib/pkgconfig -name 'x*.pc' | sort
          "

      - name: "Build Wine for x86_64"
        run: |
          sudo arch-chroot /mnt/arch bash -c "
            # Setup environment
            export PATH=/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:/cache/mingw/bin:\$PATH
            export ANDROID_SDK=28
            export ARCH=x86_64
            export CC=\$ARCH-linux-android\$ANDROID_SDK-clang
            export CXX=\$ARCH-linux-android\$ANDROID_SDK-clang++
            export TOOLCHAIN_VERSION=\$ARCH-linux-android-4.9
            export TOOLCHAIN_TRIPLE=\$ARCH-linux-android
            export PREFIX=/prefix-x86_64
            export PKG_CONFIG_PATH=/prefix-x86_64/lib/pkgconfig:\$PKG_CONFIG_PATH
            export CPPFLAGS=\"-I/prefix-x86_64/include\"
            export LDFLAGS=\"-L/prefix-x86_64/lib\"
            
            cd /wine-build
            
            # Build wine for x86_64
            mkdir -p build-x86_64
            cd build-x86_64
            echo 'Configuring x86_64 build...'
            ../configure --enable-archs=i386,x86_64 \
              --host=\$TOOLCHAIN_TRIPLE \
              --with-wine-tools=/wine-build/wine-tools \
              --prefix=\$PREFIX \
              --without-oss \
              --disable-winemenubuilder \
              --disable-win16 \
              --disable-tests \
              --with-x \
              --x-libraries=\$PREFIX/lib \
              --x-includes=\$PREFIX/include \
              --with-pulse \
              --with-gstreamer \
              --with-opengl \
              --with-gnutls \
              --with-mingw=gcc \
              --with-xinput \
              --with-xinput2 \
              --enable-nls \
              --without-xshm \
              --without-xxf86vm \
              --without-osmesa \
              --without-usb \
              --without-sdl \
              --without-cups \
              --without-netapi \
              --without-pcap \
              --without-gphoto \
              --without-v4l2 \
              --without-pcsclite \
              --without-wayland \
              --without-opencl \
              --without-dbus \
              --without-sane \
              --without-udev \
              --without-capi
            make -j \$(nproc)
            cd ..
            
            # Package the build
            cd build-x86_64
            tar -czf /wine-x86_64.tar.gz .
          "
          
          # Copy output to workspace
          sudo cp /mnt/arch/wine-x86_64.tar.gz ./

      - name: "Upload ARM64 Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64
          path: wine-arm64.tar.gz

      - name: "Upload x86_64 Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: wine-x86_64.tar.gz 