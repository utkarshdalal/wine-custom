name: Build Wine for Winlator

on:
  push:
    branches: [ main, custom-wine-9.16 ]
  pull_request:
    branches: [ main, custom-wine-9.16 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Install ArchLinux"
        run: |
          sudo apt update
          sudo apt install -y arch-install-scripts wget
          sudo mkdir -p /mnt/

          wget https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst

          sudo tar -xf archlinux-bootstrap-x86_64.tar.zst
          sudo rm -f archlinux-bootstrap-x86_64.tar.zst
          sudo mv root.x86_64 /mnt/arch

          sudo arch-chroot /mnt/arch bash -c "pacman-key --init && pacman-key --populate && sed -i 's/#Server/Server/g' /etc/pacman.d/mirrorlist && sed -i 's/CheckSpace/#CheckSpace/g' /etc/pacman.conf && pacman -Syu --noconfirm base base-devel git cmake meson ninja bison flex python-pip wget python-mako python-pyyaml unzip p7zip glslang python-docutils xmlto fop libxslt libx11 libxi libxext libxinerama libxrandr libxrender libxfixes libxcursor"

      - name: "Setup Basic Android Runtime Environment"
        run: |
          git clone https://github.com/termux/termux-docker.git
          sudo cp -rf termux-docker/system/x86 /mnt/arch/system
          sudo chown -R $(whoami):$(whoami) /mnt/arch/system
          sudo chmod 755 -R /mnt/arch/system

      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup NDK for Cross-Compilation"
        run: |
          # Download NDK and extract it properly
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          sudo mkdir -p /mnt/arch/cache
          
          # Use unzip with -K flag to properly handle symbolic links
          sudo unzip -q -K android-ndk-r26b-linux.zip -d /mnt/arch/cache/
          sudo mv /mnt/arch/cache/android-ndk-r26b /mnt/arch/cache/android-ndk
          
          # Download and extract MinGW
          wget -q http://techer.pascal.free.fr/Red-Rose_MinGW-w64-Toolchain/Red-Rose-MinGW-w64-Posix-Urct-v12.0.0.r458.g03d8a40f5-Gcc-11.5.0.tar.xz
          sudo mkdir -p /mnt/arch/cache/mingw-temp
          sudo tar -xf Red-Rose-MinGW-w64-Posix-Urct-v12.0.0.r458.g03d8a40f5-Gcc-11.5.0.tar.xz -C /mnt/arch/cache/mingw-temp
          sudo mv /mnt/arch/cache/mingw-temp /mnt/arch/cache/mingw
          
          # Setup permissions
          sudo chown -R $(whoami):$(whoami) /mnt/arch/cache
          sudo chmod -R 755 /mnt/arch/cache
          
          # Verify NDK installation
          ls -la /mnt/arch/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ || echo "NDK bins not found!"

          # Setup working directory
          sudo mkdir -p /mnt/arch/wine-build
          sudo cp -rf ./* /mnt/arch/wine-build/
          sudo mkdir -p /mnt/arch/wine-build/wine-tools
          sudo mkdir -p /mnt/arch/wine-build/build-arm64
          sudo mkdir -p /mnt/arch/wine-build/build-x86_64
          
          # Create prefix directory
          sudo mkdir -p /mnt/arch/prefix/lib
          sudo mkdir -p /mnt/arch/prefix/include
          
          # Make sure we have correct permissions
          sudo chown -R $(whoami):$(whoami) /mnt/arch/wine-build
          sudo chmod -R 755 /mnt/arch/wine-build
          sudo chown -R $(whoami):$(whoami) /mnt/arch/prefix
          sudo chmod -R 755 /mnt/arch/prefix

      - name: "Build Wine for ARM64"
        run: |
          sudo arch-chroot /mnt/arch bash -c "
            # Debug X11 library installation
            echo 'Checking X11 libraries installation...'
            pacman -Q | grep -i x11
            ls -la /usr/lib/libX*.so*
            ls -la /usr/include/X11
            
            # Create symbolic links in prefix directory
            echo 'Creating X11 symbolic links in prefix directory...'
            mkdir -p /prefix/lib
            mkdir -p /prefix/include
            ln -sf /usr/lib/libX*.so* /prefix/lib/
            cp -r /usr/include/X11 /prefix/include/
            ls -la /prefix/lib/libX*.so*
            ls -la /prefix/include/X11
            
            # Verify NDK is properly extracted
            echo 'Checking NDK setup...'
            ls -la /cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/
            
            # Setup environment
            export PATH=/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:/cache/mingw/bin:\$PATH
            export ANDROID_SDK=29
            export ARCH=aarch64
            export CC=\$ARCH-linux-android\$ANDROID_SDK-clang
            export CXX=\$ARCH-linux-android\$ANDROID_SDK-clang++
            export TOOLCHAIN_VERSION=\$ARCH-linux-android-4.9
            export TOOLCHAIN_TRIPLE=\$ARCH-linux-android
            export PREFIX=/prefix
            
            cd /wine-build
            
            # Debug the directory structure
            echo 'Current directory structure:'
            ls -la
            echo 'Current working directory:'
            pwd
            
            # First build wine-tools properly - important to unset compiler vars
            mkdir -p wine-tools
            cd wine-tools
            echo 'Configuring wine-tools...'
            # Need to unset cross-compile vars for native build
            unset CC CXX ARCH TOOLCHAIN_VERSION TOOLCHAIN_TRIPLE
            ../configure --enable-win64 --without-x
            echo 'Building wine-tools...'
            make -j $(nproc) __tooldeps__ nls/all
            cd ..
            
            # Debug the wine-tools directory
            echo 'Wine-tools directory contents:'
            find wine-tools -type f | head -n 20
            
            # Reset environment for cross-compilation
            export ANDROID_SDK=29
            export ARCH=aarch64
            export CC=\$ARCH-linux-android\$ANDROID_SDK-clang
            export CXX=\$ARCH-linux-android\$ANDROID_SDK-clang++
            export TOOLCHAIN_VERSION=\$ARCH-linux-android-4.9
            export TOOLCHAIN_TRIPLE=\$ARCH-linux-android
            
            # Build wine for ARM64
            mkdir -p build-arm64
            cd build-arm64
            echo 'Configuring ARM64 build...'
            ../configure --enable-archs=i386,x86_64 \
              --host=\$TOOLCHAIN_TRIPLE \
              --with-wine-tools=/wine-build/wine-tools \
              --prefix=\$PREFIX \
              --without-oss \
              --disable-winemenubuilder \
              --disable-win16 \
              --disable-tests \
              --with-x \
              --x-libraries=\$PREFIX/lib \
              --x-includes=\$PREFIX/include \
              --with-pulse \
              --with-gstreamer \
              --with-opengl \
              --with-gnutls \
              --with-mingw=gcc \
              --with-xinput \
              --with-xinput2 \
              --enable-nls \
              --without-xshm \
              --without-xxf86vm \
              --without-osmesa \
              --without-usb \
              --without-sdl \
              --without-cups \
              --without-netapi \
              --without-pcap \
              --without-gphoto \
              --without-v4l2 \
              --without-pcsclite \
              --without-wayland \
              --without-opencl \
              --without-dbus \
              --without-sane \
              --without-udev \
              --without-capi
            make -j \$(nproc)
            cd ..
            
            # Package the build
            cd build-arm64
            tar -czf /wine-arm64.tar.gz .
          "
          
          # Copy output to workspace
          sudo cp /mnt/arch/wine-arm64.tar.gz ./

      - name: "Build Wine for x86_64"
        run: |
          sudo arch-chroot /mnt/arch bash -c "
            
            # Setup environment
            export PATH=/cache/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:/cache/mingw/bin:\$PATH
            export ANDROID_SDK=29
            export ARCH=x86_64
            export CC=\$ARCH-linux-android\$ANDROID_SDK-clang
            export CXX=\$ARCH-linux-android\$ANDROID_SDK-clang++
            export TOOLCHAIN_VERSION=\$ARCH-linux-android-4.9
            export TOOLCHAIN_TRIPLE=\$ARCH-linux-android
            export PREFIX=/prefix
            
            cd /wine-build
            
            # Debug the wine-tools directory
            echo 'Wine-tools directory contents:'
            find wine-tools -type f | head -n 20
            
            # Build wine for x86_64
            mkdir -p build-x86_64
            cd build-x86_64
            echo 'Configuring x86_64 build...'
            ../configure --enable-archs=i386,x86_64 \
              --host=\$TOOLCHAIN_TRIPLE \
              --with-wine-tools=/wine-build/wine-tools \
              --prefix=\$PREFIX \
              --without-oss \
              --disable-winemenubuilder \
              --disable-win16 \
              --disable-tests \
              --with-x \
              --x-libraries=\$PREFIX/lib \
              --x-includes=\$PREFIX/include \
              --with-pulse \
              --with-gstreamer \
              --with-opengl \
              --with-gnutls \
              --with-mingw=gcc \
              --with-xinput \
              --with-xinput2 \
              --enable-nls \
              --without-xshm \
              --without-xxf86vm \
              --without-osmesa \
              --without-usb \
              --without-sdl \
              --without-cups \
              --without-netapi \
              --without-pcap \
              --without-gphoto \
              --without-v4l2 \
              --without-pcsclite \
              --without-wayland \
              --without-opencl \
              --without-dbus \
              --without-sane \
              --without-udev \
              --without-capi
            make -j \$(nproc)
            cd ..
            
            # Package the build
            cd build-x86_64
            tar -czf /wine-x86_64.tar.gz .
          "
          
          # Copy output to workspace
          sudo cp /mnt/arch/wine-x86_64.tar.gz ./

      - name: "Upload ARM64 Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64
          path: wine-arm64.tar.gz

      - name: "Upload x86_64 Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: wine-x86_64.tar.gz 